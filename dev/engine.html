<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Engine test page</title>
  <style>
    body { font: 14px/1.4 system-ui, sans-serif; margin: 24px; background: #fff; color: #111; }
    button { margin-right: 8px; }
    #log { white-space: pre-wrap; font: 12px/1.3 ui-monospace, monospace; max-height: 240px; overflow: auto; background: #f4f4f4; padding: 8px; }
  </style>
</head>
<body>
  <h1>Engine test page (development only)</h1>
  <p>
    <button id="play-a">Play A (440 Hz)</button>
    <button id="play-b">Play B (MIDI synth)</button>
    <button id="stop">Stop</button>
  </p>
  <p><label>Amp <input id="amp" type="range" min="0" max="1" step="0.01" value="0.5" /></label></p>
  <p>State: <span id="state">idle</span> · wasm: <span id="wasm">idle</span> · peak: <span id="peak">0</span></p>
  <div id="log"></div>
  <script type="module" src="./engine.ts"></script>
</body>
</html>
