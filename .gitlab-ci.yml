# Publishes the portfolio to GitLab Pages from the default branch.
image: node:22

cache:
  key: npm-and-csound
  paths:
    - node_modules/
    - .cache/csound/

pages:
  script:
    - npm ci
    - npm run check
    - npm run build
    - rm -rf public && mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
